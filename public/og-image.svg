<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogBg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#104638"/>
      <stop offset="60%" stop-color="#063B30"/>
      <stop offset="100%" stop-color="#031F19"/>
    </radialGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD477"/>
      <stop offset="50%" stop-color="#F9BE4A"/>
      <stop offset="100%" stop-color="#C88E23"/>
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#F9BE4A" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Right side glowing digital sphere / network -->
  <g transform="translate(850, 315)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#goldG)" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldG)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="#104638" stroke="url(#goldG)" stroke-width="3" filter="url(#ogGlow)"/>
    
    <!-- Orbital Nodes -->
    <circle cx="-130" cy="0" r="9" fill="#FFD477" filter="url(#ogGlow)"/>
    <circle cx="92" cy="-92" r="7" fill="#F9BE4A"/>
    <circle cx="0" cy="130" r="8" fill="#FFD477"/>
    <circle cx="-60" cy="70" r="6" fill="#F9BE4A"/>
    <circle cx="110" cy="50" r="7" fill="#FFD477"/>
    <circle cx="0" cy="0" r="16" fill="url(#goldG)" filter="url(#ogGlow)"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(90, 160)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#104638" stroke="#F9BE4A" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#FFD477"/>
    <text x="36" y="24" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#FFD477">
      EMPOWERING FUTURE ENTERPRISES
    </text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">
      Nex<tspan fill="url(#goldG)">Fero</tspan> Innovations
    </text>

    <!-- Tagline -->
    <text x="0" y="150" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="600" fill="#FFD477" letter-spacing="1">
      Beyond Ideas. Beyond Limits.
    </text>

    <!-- Description -->
    <text x="0" y="210" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="20" fill="#C4D6CD">
      Building Tomorrow Through Intelligent Technology.
    </text>
    <text x="0" y="245" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" fill="#C4D6CD" opacity="0.85">
      AI Systems • Web Architecture • Cloud Platforms • Digital Innovation
    </text>

    <!-- Location & Status -->
    <text x="0" y="320" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFD477" letter-spacing="1">
      📍 Chennai, Tamil Nadu, India  |  nexferoinnovations@gmail.com
    </text>
  </g>
</svg>
