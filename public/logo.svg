<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD477"/>
      <stop offset="50%" stop-color="#F9BE4A"/>
      <stop offset="100%" stop-color="#C88E23"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#165B4C"/>
      <stop offset="100%" stop-color="#063B30"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Mark (Hex Shield with Interlocking N & F Nodes) -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="50,5 92,28 92,72 50,95 8,72 8,28" 
             fill="url(#emeraldGrad)" 
             stroke="url(#goldGrad)" 
             stroke-width="2.5" 
             filter="url(#glow)"/>
    
    <!-- Inner Circuit Lines -->
    <path d="M50,14 L84,33 L84,67 L50,86 L16,67 L16,33 Z" 
          fill="none" 
          stroke="#F9BE4A" 
          stroke-width="1" 
          stroke-opacity="0.35" 
          stroke-dasharray="3,3"/>

    <!-- Stylized Futuristic 'N' and 'F' Monogram -->
    <!-- N left pillar -->
    <path d="M30,30 L30,70" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- N diagonal bridging to F -->
    <path d="M30,32 L68,68" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- F right pillar & top arm -->
    <path d="M68,32 L68,70" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M68,32 L82,32" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M68,50 L79,50" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Connected Tech Nodes -->
    <circle cx="30" cy="30" r="4.5" fill="#FFD477" filter="url(#glow)"/>
    <circle cx="30" cy="70" r="4.5" fill="#F9BE4A"/>
    <circle cx="68" cy="32" r="4.5" fill="#FFD477" filter="url(#glow)"/>
    <circle cx="68" cy="70" r="4.5" fill="#F9BE4A"/>
    <circle cx="82" cy="32" r="3.5" fill="#FFD477"/>
    <circle cx="79" cy="50" r="3" fill="#FFD477"/>
    <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(125, 42)">
    <!-- NexFero Brand Name -->
    <text x="0" y="26" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">
      Nex<tspan fill="url(#goldGrad)">Fero</tspan>
    </text>
    
    <!-- Subtitle INNOVATIONS -->
    <text x="2" y="48" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="5" fill="#FFD477">
      INNOVATIONS
    </text>

    <!-- Micro Slogan -->
    <text x="145" y="48" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#C4D6CD" opacity="0.8">
      | BEYOND LIMITS
    </text>
  </g>
</svg>
